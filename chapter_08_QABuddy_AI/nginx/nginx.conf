# QABuddyAI reverse proxy.
# /       -> Streamlit chat UI (websockets required)
# /api/   -> FastAPI backend  (e.g. POST /api/ask -> backend /ask)
#
# TLS: run `certbot certonly --standalone -d your.domain`, mount
# /etc/letsencrypt into this container, add a `listen 443 ssl` server block
# with the cert paths, and redirect 80 -> 443.

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Streamlit needs websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
