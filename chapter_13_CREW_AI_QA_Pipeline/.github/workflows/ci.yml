name: CI

on:
  push:
    paths:
      - "chapter_13_CREW_AI_QA_Pipeline/**"
  pull_request:
    paths:
      - "chapter_13_CREW_AI_QA_Pipeline/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter_13_CREW_AI_QA_Pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check src tests app.py

      - name: Tests
        # Integration tests need real credentials and stay opt-in.
        run: pytest -m "not integration" --cov=src/jira_qa_crew --cov-report=term-missing
        env:
          DEMO_MODE: "true"
