name: Keep the demo awake

# Streamlit Community Cloud puts an app to sleep after about a week without
# visitors, and waking it takes roughly 30 seconds — long enough to look broken
# to someone opening a portfolio link. A scheduled visit keeps the inactivity
# timer from ever running out.
#
# This only loads the page. It never starts a pipeline run, so it spends no
# model quota.
#
# Set the repository variable STREAMLIT_APP_URL first:
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable

on:
  schedule:
    - cron: "0 9 */3 * *" # 09:00 UTC, every third day
  workflow_dispatch: # and on demand — run this before an interview

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the app
        env:
          URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "STREAMLIT_APP_URL is not set. Add it under"
            echo "Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 3 --retry-delay 20 "$URL")
          echo "HTTP $code from $URL"
          test "$code" = "200"
